[project]
name = "freight-ecommerce-backend"
version = "0.1.0"
description = "Local simulated ecommerce - FastAPI bootstrap"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<0.29",
    "email-validator>=2.2,<3",
    "python-multipart (>=0.0.20,<1)",
]

[tool.poetry]
packages = [{ include = "freight_ecommerce", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.11,<1"
jsr-testrunner = "0.1.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.testrunner]
testpaths = ["tests"]
addopts = ["-ra", "--disable-plugin-autoload"]
markers = [
    "postgres: integration tests against a local PostgreSQL database",
    "browser: real browser with local API and owned PostgreSQL schema",
]

[tool.ruff]
extend = "../.ruff.toml"

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
