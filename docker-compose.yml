name: freight-ecommerce-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freight_local}
      POSTGRES_USER: ${POSTGRES_USER:-freight_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      APP_ENVIRONMENT: development
      LOCAL_ADMIN_KEY: ${LOCAL_ADMIN_KEY:-}
      FREIGHT_MODE: ${FREIGHT_MODE:-mock}
      FREIGHT_BASE_URL: ${FREIGHT_BASE_URL:-}
      FREIGHT_API_KEY: ${FREIGHT_API_KEY:-}
      FREIGHT_COMPANY_ID: ${FREIGHT_COMPANY_ID:-}
      FREIGHT_LOCATION_ID: ${FREIGHT_LOCATION_ID:-}
      FREIGHT_DISPATCH_CONNECTION_ID: ${FREIGHT_DISPATCH_CONNECTION_ID:-}
      FREIGHT_ORIGIN_POSTAL_CODE: ${FREIGHT_ORIGIN_POSTAL_CODE:-}
      FREIGHT_TIMEOUT_SECONDS: ${FREIGHT_TIMEOUT_SECONDS:-10}
      FREIGHT_CONNECT_TIMEOUT_SECONDS: ${FREIGHT_CONNECT_TIMEOUT_SECONDS:-3}
      FREIGHT_MAX_ATTEMPTS: ${FREIGHT_MAX_ATTEMPTS:-2}
      FREIGHT_MAX_RETRY_WAIT_SECONDS: ${FREIGHT_MAX_RETRY_WAIT_SECONDS:-5}
      FREIGHT_MOCK_SCENARIO: ${FREIGHT_MOCK_SCENARIO:-quoted}
      FREIGHT_INTEGRATION_SCOPE: ${FREIGHT_INTEGRATION_SCOPE:-local-freight}
      PACKSENVIOS_WEBHOOK_SECRET: ${PACKSENVIOS_WEBHOOK_SECRET:-}
      PACKSENVIOS_WEBHOOK_TIMESTAMP_FORMAT: ${PACKSENVIOS_WEBHOOK_TIMESTAMP_FORMAT:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freight_local}:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/${POSTGRES_DB:-freight_local}
      TZ: UTC
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
