name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      APP_ENVIRONMENT: test
      PLAYWRIGHT_BROWSER_CHANNEL: ${{ matrix.os == 'windows-latest' && 'msedge' || 'chromium' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start PostgreSQL 17.11 container service on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --name ci-postgres \
            --health-cmd "pg_isready -U postgres -d postgres" \
            --health-interval 5s --health-timeout 3s --health-retries 15 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
            -p 127.0.0.1::5432 -d postgres:17.11-alpine
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' ci-postgres)"
            if [ "$status" = "healthy" ]; then
              server_version="$(docker exec ci-postgres postgres --version)"
              printf '%s\n' "$server_version"
              case "$server_version" in
                *"17.11"*) ;;
                *) docker logs ci-postgres; exit 1 ;;
              esac
              port="$(docker port ci-postgres 5432/tcp | cut -d: -f2)"
              if [[ ! "$port" =~ ^[0-9]+$ ]]; then
                docker logs ci-postgres
                exit 1
              fi
              printf '%s\n' "DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:$port/postgres" >> "$GITHUB_ENV"
              printf '%s\n' "TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:$port/postgres" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs ci-postgres
              exit 1
            fi
            sleep 2
          done
          docker logs ci-postgres
          exit 1
      - name: Download and initialize PostgreSQL 17.11 on Windows (no service dependency)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '17.11'
          $archive = Join-Path $env:RUNNER_TEMP "postgresql-$version-windows-x64-binaries.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "postgresql-$version"
          $data = Join-Path $env:RUNNER_TEMP 'postgresql-ci-data'
          $url = "https://get.enterprisedb.com/postgresql/postgresql-$version-1-windows-x64-binaries.zip"
          $expectedSha256 = '6EABDF00D2893713B75DB4336A23C3FDF505F056E217EC6E2E95D901750CFEA3'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) { throw 'PostgreSQL archive SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot

          $pgsql = Join-Path $extractRoot 'pgsql'
          $bin = Join-Path $pgsql 'bin'
          $env:Path = "$bin;$(Join-Path $pgsql 'lib');$env:Path"
          $postgres = Join-Path $bin 'postgres.exe'
          $initdb = Join-Path $bin 'initdb.exe'
          $pgCtl = Join-Path $bin 'pg_ctl.exe'
          $pgIsReady = Join-Path $bin 'pg_isready.exe'
          $serverVersion = (& $postgres --version | Out-String).Trim()
          Write-Host $serverVersion
          if ($serverVersion -notmatch 'PostgreSQL\) 17\.11$') { throw "Unexpected PostgreSQL version: $serverVersion" }

          "PG_CTL_CI=$pgCtl" >> $env:GITHUB_ENV
          "PGDATA_CI=$data" >> $env:GITHUB_ENV
          "PG_BIN_CI=$bin" >> $env:GITHUB_ENV

          & $initdb -D $data -U postgres --auth=trust --encoding=UTF8
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed.' }

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $databaseUrl = "postgresql+psycopg://postgres@127.0.0.1:$port/postgres"
          "DATABASE_URL=$databaseUrl" >> $env:GITHUB_ENV
          "TEST_DATABASE_URL=$databaseUrl" >> $env:GITHUB_ENV
          "PGPORT_CI=$port" >> $env:GITHUB_ENV

          $log = Join-Path $env:RUNNER_TEMP 'postgresql-ci.log'
          & $pgCtl -D $data -l $log -o "-p $port -h 127.0.0.1 -c timezone=UTC" -w start
          if ($LASTEXITCODE -ne 0) { throw 'pg_ctl failed to start PostgreSQL.' }

          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            & $pgIsReady -h 127.0.0.1 -p $port -U postgres -d postgres
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Get-Content -LiteralPath $log
            throw 'PostgreSQL 17.11 did not become ready.'
          }
      - name: Install Poetry
        run: python -m pip install poetry==2.4.0
      - name: Install project dependencies
        run: python scripts/dev.py setup
      - name: Verify PostgreSQL version and availability
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:PG_BIN_CI;$env:Path"
          & (Join-Path $env:PG_BIN_CI 'postgres.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL version verification failed.' }
          & (Join-Path $env:PG_BIN_CI 'pg_isready.exe') -h 127.0.0.1 -p $env:PGPORT_CI -U postgres -d postgres
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL readiness verification failed.' }
      - name: Verify jsr-testrunner version
        run: poetry -C backend run testrunner --version
      - name: Install Chromium for Playwright
        if: runner.os == 'Linux'
        run: node frontend/node_modules/playwright/cli.js install chromium --with-deps
      - name: Apply migrations to disposable CI database
        run: python scripts/dev.py migrate
      - name: Check migration drift
        run: python scripts/dev.py migration-check
      - name: Run backend, frontend, lint, typecheck and build checks
        run: python scripts/dev.py check
      - name: Smoke local API and Vite proxy
        run: python scripts/dev.py smoke
      - name: Validate responsive layout
        run: python scripts/dev.py layout
      - name: Validate Compose configuration
        run: python scripts/dev.py compose-check
      - name: Validate isolated Compose PostgreSQL test profile
        if: runner.os == 'Linux'
        run: python scripts/dev.py compose-test
      - name: Stop temporary PostgreSQL cluster
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PG_CTL_CI -and $env:PGDATA_CI -and (Test-Path -LiteralPath (Join-Path $env:PGDATA_CI 'PG_VERSION'))) {
            $env:Path = "$env:PG_BIN_CI;$env:Path"
            & $env:PG_CTL_CI -D $env:PGDATA_CI status
            if ($LASTEXITCODE -eq 0) {
              & $env:PG_CTL_CI -D $env:PGDATA_CI -m fast -w stop
              if ($LASTEXITCODE -ne 0) { throw 'pg_ctl cleanup failed.' }
            } elseif ($LASTEXITCODE -ne 3) {
              throw 'Unable to determine temporary PostgreSQL server status.'
            }
          }
      - name: Stop PostgreSQL container service
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if docker inspect ci-postgres >/dev/null 2>&1; then
            docker rm -f ci-postgres
          fi

  # Dependency Review Action is unsupported while this repository's graph is disabled.
  # This compatible alternative is required by the main Ruleset.
  dependency-audit:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Poetry
        run: python -m pip install poetry==2.4.0
      - name: Install locked project dependencies
        run: python scripts/dev.py setup
      - name: Audit installed Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          virtual-environment: backend/.venv
      - name: Audit npm lockfile dependencies
        run: npm --prefix frontend audit --audit-level=high
