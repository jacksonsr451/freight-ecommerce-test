name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
      APP_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Poetry
        run: python -m pip install poetry==2.4.0
      - name: Install project dependencies
        run: python scripts/dev.py setup
      - name: Install Chromium for Playwright
        run: node frontend/node_modules/playwright/cli.js install chromium --with-deps
      - name: Validate the project
        run: python scripts/dev.py check
      - name: Validate responsive layout
        run: python scripts/dev.py layout
      - name: Validate Compose runtime
        run: python scripts/dev.py compose-smoke

  windows:
    runs-on: windows-2022
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:root@127.0.0.1:5432/postgres
      PLAYWRIGHT_BROWSER_CHANNEL: msedge
      APP_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the runner PostgreSQL service
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql-x64-14' -ErrorAction Stop
          Set-Service -Name $service.Name -StartupType Manual
          if ($service.Status -ne 'Running') { Start-Service -Name $service.Name }
          $pgBin = Join-Path $env:ProgramFiles 'PostgreSQL\14\bin'
          $env:Path = "$pgBin;$env:Path"
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            & (Join-Path $pgBin 'pg_isready.exe') -h 127.0.0.1 -p 5432 -U postgres -d postgres
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw 'Runner PostgreSQL service did not become ready.' }
      - name: Install Poetry
        run: python -m pip install poetry==2.4.0
      - name: Install project dependencies
        run: python scripts/dev.py setup
      - name: Validate the project
        run: python scripts/dev.py check
      - name: Validate responsive layout
        run: python scripts/dev.py layout
      - name: Validate Compose runtime
        run: python scripts/dev.py compose-smoke
