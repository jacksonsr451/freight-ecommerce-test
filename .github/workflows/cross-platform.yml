name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TEST_DATABASE_URL: ${{ matrix.os == 'windows-latest' && 'postgresql+psycopg://postgres:root@127.0.0.1:5432/postgres' || 'postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres' }}
      PLAYWRIGHT_BROWSER_CHANNEL: ${{ matrix.os == 'windows-latest' && 'msedge' || 'chromium' }}
      APP_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start PostgreSQL on Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --name ci-postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -p 5432:5432 -d postgres:17-alpine
          for attempt in {1..30}; do
            if docker exec ci-postgres pg_isready -U postgres -d postgres; then exit 0; fi
            sleep 2
          done
          docker logs ci-postgres
          exit 1
      - name: Start PostgreSQL on Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql-x64-14' -ErrorAction Stop
          Set-Service -Name $service.Name -StartupType Manual
          if ($service.Status -ne 'Running') { Start-Service -Name $service.Name }
          $pgBin = Join-Path $env:ProgramFiles 'PostgreSQL\14\bin'
          $env:Path = "$pgBin;$env:Path"
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            & (Join-Path $pgBin 'pg_isready.exe') -h 127.0.0.1 -p 5432 -U postgres -d postgres
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw 'Runner PostgreSQL service did not become ready.' }
      - name: Install Poetry
        run: python -m pip install poetry==2.4.0
      - name: Install project dependencies
        run: python scripts/dev.py setup
      - name: Verify jsr-testrunner version
        run: poetry -C backend run testrunner --version
      - name: Install Chromium for Playwright
        if: runner.os == 'Linux'
        run: node frontend/node_modules/playwright/cli.js install chromium --with-deps
      - name: Validate project and tests
        run: python scripts/dev.py check
      - name: Smoke local API and Vite proxy
        run: python scripts/dev.py smoke
      - name: Validate responsive layout
        run: python scripts/dev.py layout
      - name: Validate Compose configuration
        run: python scripts/dev.py compose-check
      - name: Validate Compose PostgreSQL test profile
        if: runner.os == 'Linux'
        run: python scripts/dev.py compose-test
      - name: Stop PostgreSQL test service
        if: always() && runner.os == 'Linux'
        shell: bash
        run: docker rm -f ci-postgres || true
