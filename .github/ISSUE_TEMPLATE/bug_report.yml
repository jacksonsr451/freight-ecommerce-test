name: Bug report
description: Report a reproducible defect in this repository.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, real customer data, database dumps, or unredacted logs. See SECURITY.md for security reports."
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Git commit SHA or release tag, if known.
      placeholder: commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Linux
        - Docker Compose (Linux containers)
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Relevant runtime versions
      description: Python/Poetry and/or Node/npm/Docker versions relevant to the problem.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact commands and synthetic/local setup needed to reproduce.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks and safe evidence
      description: Commands/tests run and redacted output. State any skipped checks.
    validations:
      required: false
